<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f9fafb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #111827;
    }
    .wrap {
      text-align: center;
      max-width: 360px;
    }
    .code {
      font-size: 72px;
      font-weight: 800;
      letter-spacing: -4px;
      color: #e5e7eb;
      line-height: 1;
      margin-bottom: 24px;
      user-select: none;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    p {
      font-size: 15px;
      color: #6b7280;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>This page isn't accessible</h1>
    <p>This page is invite-only. You'll need the link shared by the inviter to access this page.</p>
  </div>
</body>
</html>
